# 編譯 iPhone App（原生 SwiftUI）：ios/ 資料夾有變動就會執行。
# 只確認程式能編譯成功，不產生可以安裝的檔案：
# 要裝到 iPhone 上需要用 Apple ID 簽名，只能在自己的 Mac 上用 Xcode 裝（見 README）。

name: 編譯 iPhone App

on:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/build-ios.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Liquid Glass 的 API 是 iOS 26 才有的，需要 Xcode 26 以上
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: 編譯（不簽名）
        run: |
          xcodebuild -project ios/BanGo.xcodeproj -target BanGo \
            -configuration Release -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO build
