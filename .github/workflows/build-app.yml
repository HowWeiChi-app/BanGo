# 自動編譯 Android App：app/ 資料夾有變動就會執行。
# 跑完後，在這次執行的頁面最下面「Artifacts」可以下載 APK（要登入 GitHub，30 天後刪除）。
#
# 要發給同學時，推一個 v 開頭的標籤，就會自動建立 GitHub Release 並附上 APK，
# 同學不用登入就能從 Release 頁面下載：
#   git tag v0.1.0
#   git push origin v0.1.0

name: 編譯 App

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/build-app.yml"
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # 建立 Release 需要

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # 要用 21：新版 Android lint 用到 Java 21 才有的功能，用 17 會在編譯時當掉
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 產生 Android 專案檔
        run: bash tool/prepare_android.sh

      - name: 確認網路權限有加上（沒有的話 App 會抓不到公告）
        run: grep -q 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml

      - name: 下載套件
        run: flutter pub get

      - name: 檢查程式碼
        run: flutter analyze --no-fatal-infos

      - name: 跑測試
        run: flutter test

      - name: 編譯 APK
        run: flutter build apk --release

      - name: 上傳 APK
        uses: actions/upload-artifact@v4
        with:
          name: hsnu-notice-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: 建立 Release（只有推 v 開頭的標籤時）
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk "hsnu-notice-${GITHUB_REF_NAME}.apk"
          gh release create "$GITHUB_REF_NAME" "hsnu-notice-${GITHUB_REF_NAME}.apk" \
            --title "附中公告 ${GITHUB_REF_NAME}" \
            --notes "下載下面的 .apk 檔，傳到 Android 手機上安裝（要允許「安裝不明來源的應用程式」）。"
