# GitHub Actions 排程：定時抓公告、發到 Discord。
# 這個檔案要放在 repo 根目錄的 .github/workflows/ 底下才會生效。

name: 抓校網公告

on:
  schedule:
    # 時間是 UTC（台灣時間減 8 小時），格式：分 時 日 月 星期
    # 每 10 分鐘一次（每小時的第 3、13、23…53 分）。避開整點是因為 GitHub 在整點最塞，延遲最嚴重。
    # 為什麼是 10 分鐘、不再更密：
    #   - repo 是 public：GitHub 提供的機器不算分鐘數，跑幾次都免費（一次約 20 秒）。
    #     如果改成 private，每月只有 2000 分鐘，要改回每 30 分鐘（"13,43 * * * *"）。
    #   - App 讀的 raw.githubusercontent.com 本身會快取約 5 分鐘，抓得比 10 分鐘更密，手機上也看不出差別。
    #   - 每次每間學校只抓幾個 RSS，10 分鐘一次對校網的負擔很小。
    #   - GitHub 的排程是「盡量」：機器忙的時候會晚跑、甚至跳過，實際間隔常常比這裡寫的長。
    - cron: "3-59/10 * * * *"
  workflow_dispatch: # 讓你可以在 GitHub 網頁的 Actions 分頁手動按「Run workflow」
    inputs:
      send_test:
        description: "發一則測試訊息到 Discord（確認 webhook 設定正確）"
        type: boolean
        default: false

permissions:
  contents: write # 要把 data/seen.json commit 回 repo

concurrency:
  group: scrape # 上一次還沒跑完時，不會同時跑第二個，避免重複發通知
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 8  # 五間學校，建中的 RSS 比較大
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安裝手機推播要用的套件
        run: pip install --quiet google-auth requests

      - name: 跑測試（測試沒過就不發通知）
        working-directory: scraper
        run: python -m unittest

      - name: 抓公告並發到 Discord
        working-directory: scraper
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SEND_TEST: ${{ inputs.send_test }} # 排程自動執行時是空的，不會發測試訊息
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }} # 還沒設定時是空的，就不發手機推播
        run: python run.py

      - name: 把看過的公告存回 repo
        # always()：上一步失敗也要執行。手機推播失敗時 run.py 會存好已讀紀錄再回報失敗，
        # 如果這步被跳過，下次 Discord 就會重複發。
        # （Discord 發送失敗時 run.py 不會更新已讀紀錄，這裡就沒有東西可以 commit，不會漏發）
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scraper/data  # 附中的已讀紀錄和公告，加上其他學校的 data/<學校>/notices.json
          # 沒有新公告就沒有變動，不 commit
          git diff --cached --quiet && exit 0
          git commit -m "更新已讀公告"
          # 執行期間如果有人推了新的 commit，直接 push 會被拒絕，
          # 已讀紀錄沒存到，下次就會重複發通知。所以先把別人的 commit 拉下來再推，失敗就重試幾次。
          # （data/ 裡的檔案只有這個機器人會改，不會有衝突）
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep 5
          done
          exit 1
